<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПРОЕКТОР 7 — варианты заставки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0c0c14;
    color: #fff;
    font-family: 'Unbounded', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 16px;
    background: #111118;
    border-bottom: 1px solid #26263a;
    position: relative;
    z-index: 10;
  }
  .tabs button {
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border: 1px solid #3a3a5c;
    background: transparent;
    color: #9aa0c0;
    cursor: pointer;
    border-radius: 6px;
    transition: all .2s;
  }
  .tabs button.active { background: #2222b2; border-color: #2222b2; color: #fff; }
  .tabs button.replay { background: #ff5c35; border-color: #ff5c35; color: #fff; }
  .stage { flex: 1; position: relative; overflow: hidden; min-height: 70vh; }

  .variant { position: absolute; inset: 0; display: none; background: #0c0c14; }
  .variant.active { display: block; }
  .variant canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .label {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .15em;
    color: #565a7a;
    text-transform: uppercase;
    z-index: 5;
  }
  .center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 2;
    width: 100%;
    padding: 0 16px;
  }
  .word { display: flex; justify-content: center; gap: .02em; font-size: clamp(28px, 7vw, 68px); font-weight: 900; }
  .word span {
    display: inline-block;
    color: #fff;
    opacity: 0;
    filter: blur(16px);
    transform: scale(1.3);
  }
  .word span.accent { color: #6f72ff; }
  .play .word span { animation: letter .7s cubic-bezier(.2,.8,.3,1) forwards; animation-delay: calc(1.25s + var(--d, 0s)); }
  @keyframes letter {
    60% { opacity: 1; filter: blur(0); transform: scale(.97); }
    100% { opacity: 1; filter: blur(0); transform: scale(1); }
  }
  .tag {
    margin-top: 16px;
    font-size: clamp(12px, 2.4vw, 17px);
    font-weight: 700;
    letter-spacing: .5em;
    color: #8f96e8;
    opacity: 0;
    transform: translateY(12px);
  }
  .play .tag { animation: rise .6s 2.5s cubic-bezier(.2,.8,.3,1) forwards; }
  .feats {
    margin-top: 14px;
    font-size: clamp(10px, 2vw, 14px);
    font-weight: 600;
    letter-spacing: .18em;
    color: #6a6f92;
    opacity: 0;
    transform: translateY(12px);
  }
  .play .feats { animation: rise .6s 4.1s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  /* неоновые иконки на тёмном фоне */
  .icons {
    display: flex;
    justify-content: center;
    gap: clamp(12px, 4vw, 40px);
    margin-bottom: clamp(18px, 4vh, 36px);
  }
  .nic {
    width: clamp(58px, 13vw, 96px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 22px;
    border: 2px solid currentColor;
    background: rgba(255,255,255,.04);
    opacity: 0;
    transform: translateY(46px) scale(.4) rotate(-10deg);
  }
  .nic svg { width: 86%; height: 86%; }
  .nic svg.stroked { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .nic.hookah { color: #b28bff; box-shadow: 0 0 18px rgba(178,139,255,.35), inset 0 0 12px rgba(178,139,255,.15); }
  .nic.mic { color: #ff4fa0; box-shadow: 0 0 18px rgba(255,79,160,.35), inset 0 0 12px rgba(255,79,160,.15); }
  .nic.bar { color: #35e0c8; box-shadow: 0 0 18px rgba(53,224,200,.35), inset 0 0 12px rgba(53,224,200,.15); }
  .nic.pad { color: #ff7a4d; box-shadow: 0 0 18px rgba(255,122,77,.35), inset 0 0 12px rgba(255,122,77,.15); }
  .nic.hookah svg { filter: drop-shadow(0 0 5px #b28bff) drop-shadow(0 0 14px rgba(178,139,255,.55)); }
  .nic.mic svg { filter: drop-shadow(0 0 5px #ff4fa0) drop-shadow(0 0 14px rgba(255,79,160,.55)); }
  .nic.bar svg { filter: drop-shadow(0 0 5px #35e0c8) drop-shadow(0 0 14px rgba(53,224,200,.55)); }
  .nic.pad svg { filter: drop-shadow(0 0 5px #ff7a4d) drop-shadow(0 0 14px rgba(255,122,77,.55)); }
  .play .nic.hookah { animation: pop .7s .3s cubic-bezier(.2,1.4,.4,1) forwards; }
  .play .nic.mic { animation: pop .7s .5s cubic-bezier(.2,1.4,.4,1) forwards; }
  .play .nic.bar { animation: pop .7s .7s cubic-bezier(.2,1.4,.4,1) forwards; }
  .play .nic.pad { animation: pop .7s .9s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(46px) scale(.4) rotate(-10deg); }
    70% { opacity: 1; transform: translateY(-6px) scale(1.08) rotate(2deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
  }

  /* ==== неоновая вывеска ==== */
  .neon .word span {
    filter: none;
    transform: none;
    color: #ffd9ec;
    opacity: 0;
  }
  .neon.play .word span {
    animation: neonOn 1.1s steps(1, end) forwards;
    animation-delay: calc(.3s + var(--d, 0s) * 1.4);
    text-shadow: 0 0 4px #ff4fa0, 0 0 14px #ff4fa0, 0 0 38px #ff4fa0, 0 0 70px rgba(255,79,160,.7);
  }
  .neon .word span.accent {
    color: #dadaff;
  }
  .neon.play .word span.accent {
    text-shadow: 0 0 4px #6f72ff, 0 0 14px #6f72ff, 0 0 38px #6f72ff, 0 0 70px rgba(111,114,255,.7);
  }
  @keyframes neonOn {
    0% { opacity: 0; }
    9% { opacity: 1; }
    13% { opacity: .25; }
    19% { opacity: 1; }
    26% { opacity: .45; }
    36% { opacity: 1; }
    100% { opacity: 1; }
  }
</style>
</head>

49.88 45.12 L50.00 44.88 L50.62 44.62 L51.00 44.62 L51.75 44.25 L52.62 43.38 L53.00 42.62 L53.12 42.12 L53.12 41.12 L53.00 40.62 L52.62 39.88 L51.62 38.88 L54.62 28.88 L55.38 25.88 L55.88 23.12 L56.00 21.88 L56.00 20.00 L55.88 19.00 L55.50 17.75 L54.75 16.38 L53.88 15.50 L53.12 15.00 L51.50 14.38 Z M49.88 40.12 L50.12 40.12 L50.75 40.38 L51.25 40.88 L51.50 41.50 L51.50 41.75 L51.25 42.38 L50.75 42.88 L50.12 43.12 L49.88 43.12 L49.25 42.88 L48.75 42.38 L48.50 41.75 L48.50 41.50 L48.75 40.88 L49.25 40.38 Z"/><path d="M27.88 13.38 L27.62 13.50 L27.25 14.00 L27.25 14.38 L27.38 14.62 L27.75 15.00 L29.62 15.12 L29.62 19.25 L29.00 19.88 L28.75 20.38 L28.75 21.38 L29.00 21.88 L29.62 22.62 L29.00 23.25 L28.75 23.75 L28.75 24.75 L29.00 25.25 L29.62 25.88 L29.62 29.25 L30.00 29.75 L30.25 29.88 L30.62 29.88 L31.25 29.38 L31.25 25.88 L32.00 25.12 L32.12 24.75 L32.12 23.75 L31.88 23.25 L31.25 22.50 L32.00 21.75 L32.12 21.38 L32.12 20.38 L31.88 19.88 L31.25 19.25 L31.38 15.00 L33.12 15.00 L33.62 14.50 L33.62 13.88 L33.12 13.38 Z"/><path d="M19.62 8.25 L19.75 8.88 L20.38 9.62 L21.50 10.62 L22.25 11.12 L23.25 11.62 L24.38 12.00 L25.75 12.25 L35.12 12.25 L36.00 12.12 L37.62 11.62 L38.62 11.12 L40.00 10.12 L40.62 9.50 L41.25 8.62 L41.25 8.25 L40.75 7.62 L31.25 7.50 L31.38 5.38 L32.25 5.38 L32.88 5.12 L33.75 4.25 L34.38 3.00 L34.62 2.12 L34.62 1.62 L34.25 1.12 L33.88 1.00 L27.00 1.00 L26.62 1.12 L26.38 1.38 L26.25 1.62 L26.25 2.12 L26.62 3.25 L27.25 4.38 L28.00 5.12 L28.25 5.25 L29.62 5.50 L29.50 7.62 L20.12 7.62 Z M22.75 9.38 L38.12 9.38 L37.88 9.62 L36.88 10.12 L35.62 10.50 L34.75 10.62 L26.12 10.62 L25.25 10.50 L24.00 10.12 L23.00 9.62 Z M28.38 3.00 L28.50 2.75 L32.62 2.88 L32.50 3.12 L31.88 3.75 L29.00 3.75 L28.50 3.25 Z"/></g></svg>';
  const MIC = '<svg class="stroked" viewBox="0 0 64 64" stroke="currentColor"><rect x="25" y="7" width="14" height="24" rx="7"/><path d="M28 14 h8 M28 20 h8 M28 26 h8"/><path d="M19 27 a13 13 0 0 0 26 0"/><path d="M32 40 v9"/><path d="M23 53 h18"/></svg>';
  const BAR = '<svg class="stroked" viewBox="0 0 64 64" stroke="currentColor"><path d="M15 13 h34 l-17 19 z"/><path d="M32 32 v15"/><path d="M22 51 h20"/><path d="M40 9 l7 -7"/><circle cx="25" cy="18" r="3"/></svg>';
  const PAD = '<svg class="stroked" viewBox="0 0 64 64" stroke="currentColor"><path d="M20 22 h24 c7 0 12 5 12 12 v5 c0 5 -4 9 -8.5 9 c-3 0 -5 -1.5 -7 -4 l-2.5 -3 h-12 l-2.5 3 c-2 2.5 -4 4 -7 4 c-4.5 0 -8.5 -4 -8.5 -9 v-5 c0 -7 5 -12 12 -12 z"/><path d="M21 30 v10 M16 35 h10"/><circle cx="44" cy="32" r="2.4" fill="currentColor" stroke="none"/><circle cx="50" cy="37" r="2.4" fill="currentColor" stroke="none"/></svg>';

  const WORD = '<span style="--d:0s">П</span><span style="--d:.11s">Р</span><span style="--d:.22s">О</span><span style="--d:.33s">Е</span><span style="--d:.44s">К</span><span style="--d:.55s">Т</span><span style="--d:.66s">О</span><span style="--d:.77s">Р</span><span class="accent" style="--d:.9s;margin-left:.35em">7</span>';
  const ICONS =
    '<div class="nic hookah">' + HOOKAH + '</div>' +
    '<div class="nic mic">' + MIC + '</div>' +
    '<div class="nic bar">' + BAR + '</div>' +
    '<div class="nic pad">' + PAD + '</div>';

  const VARIANTS = [
    { id: 'w1', cls: '',       canvas: true,  label: 'Вариант 1 — салют' },
    { id: 'w2', cls: '',       canvas: true,  label: 'Вариант 2 — шарики' },
    { id: 'w3', cls: '',       canvas: true,  label: 'Вариант 3 — тканевые ленточки' },
    { id: 'w4', cls: 'neon',   canvas: false, label: 'Вариант 4 — неоновая вывеска' },

  const stage = document.getElementById('stage');
  for (const v of VARIANTS) {
    const sec = document.createElement('section');
    sec.className = ('variant ' + v.id + ' ' + v.cls).trim();
    sec.id = v.id;
    sec.innerHTML =

        '<div class="word">' + WORD + '</div>' +
        '<div class="tag">ТАЙМ-КАФЕ</div>' +

      '<div class="label">' + v.label + '</div>';
    stage.appendChild(sec);
  }

  function makeCtx(canvas) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const stage = canvas.parentElement.getBoundingClientRect();
    canvas.width = stage.width * dpr;
    canvas.height = stage.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, W: stage.width, H: stage.height };
  }

  // ===== салют с кометными хвостами =====
  function startFireworks(canvas) {
    const { ctx, W, H } = makeCtx(canvas);
    const rockets = [], parts = [];
    const t0 = performance.now();
    let nextSpawn = 200, raf = 0, alive = true;

    function spawnRocket() {
      rockets.push({
        x: W * rand(.1, .9), y: H + 10,
        vx: rand(-.5, .5), vy: -rand(7.5, 10),
        targetY: H * rand(.12, .4), color: pick(COLORS),
        trail: [],
      });
    }
    function explode(r) {
      const n = 70 + ((Math.random() * 30) | 0);
      for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n + Math.random() * .22;
        const sp = rand(2, 7.5);
        parts.push({
          x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: rand(65, 100), age: 0, size: rand(3, 6.5),
          color: Math.random() < .25 ? pick(COLORS) : r.color,
        });
      }
    }
    function frame(now) {
      if (!alive) return;
      const t = now - t0;
      ctx.clearRect(0, 0, W, H);
      if (t > nextSpawn && t < 3400) { spawnRocket(); nextSpawn = t + rand(240, 520); }

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.x += r.vx; r.y += r.vy; r.vy += 0.04;
        r.trail.push({ x: r.x, y: r.y });
        if (r.trail.length > 16) r.trail.shift();
        for (let j = 0; j < r.trail.length; j++) {
          const k = j / r.trail.length;
          ctx.globalAlpha = k * .55;
          ctx.fillStyle = r.color;
          ctx.beginPath();
          ctx.arc(r.trail[j].x, r.trail[j].y, 1 + k * 3.2, 0, 7);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(r.x, r.y, 3.6, 0, 7); ctx.fill();
        if (r.y <= r.targetY || r.vy >= -1) { explode(r); rockets.splice(i, 1); }
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.age++; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.986; p.vy *= 0.986;
        const k = 1 - p.age / p.life;
        if (k <= 0) { parts.splice(i, 1); continue; }
        const s = p.size * (0.6 + k * 0.6);
        ctx.globalAlpha = Math.min(1, k * 1.6);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, 7); ctx.fill();
        ctx.globalAlpha = .35;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(p.x, p.y, s * .45, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      if (rockets.length || parts.length || t < 3400) raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => { alive = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); };
  }

  // ===== шарики =====
  function startBalloons(canvas) {
    const { ctx, W, H } = makeCtx(canvas);
    const balloons = [];
    const t0 = performance.now();
    let nextSpawn = 100, raf = 0, alive = true;

    function spawn() {
      const rx = rand(16, 26);
      balloons.push({
        x: W * rand(.08, .92), y: H + 60,
        rx, ry: rx * rand(1.2, 1.3),
        vy: rand(1.6, 2.8),
        phase: Math.random() * Math.PI * 2,
        color: pick(COLORS),
        age: 0,
      });
    }
    function frame(now) {
      if (!alive) return;
      const t = now - t0;
      ctx.clearRect(0, 0, W, H);
      if (t > nextSpawn && t < 3600) { spawn(); nextSpawn = t + rand(180, 420); }

      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        b.age++;
        b.y -= b.vy;
        b.x += Math.sin(b.age * .03 + b.phase) * .6;
        if (b.y < -80) { balloons.splice(i, 1); continue; }

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(Math.sin(b.age * .04 + b.phase) * .12);
        ctx.strokeStyle = 'rgba(160,164,200,.5)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(0, b.ry + 4);
        ctx.quadraticCurveTo(
          Math.sin(b.age * .06 + b.phase) * 8, b.ry + 18,
          Math.sin(b.age * .05 + b.phase + 1) * 13, b.ry + 36
        );
        ctx.stroke();
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.moveTo(-4.5, b.ry - 2); ctx.lineTo(4.5, b.ry - 2); ctx.lineTo(0, b.ry + 5);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, 0, b.rx, b.ry, 0, 0, 7);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath();
        ctx.ellipse(-b.rx * .38, -b.ry * .38, b.rx * .2, b.ry * .3, -.45, 0, 7);
        ctx.fill();
        ctx.restore();
      }
      if (balloons.length || t < 3600) raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => { alive = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); };
  }

  // ===== тканевые ленточки (крученая полоса-полигон) =====
  function startRibbons(canvas) {
    const { ctx, W, H } = makeCtx(canvas);
    const ribbons = [];
    let raf = 0, alive = true;
    const cx = W / 2, cy = H / 2;
    const n = 34;

    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(7, 15);
      ribbons.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 3.5,
        len: rand(180, 300),
        width: rand(9, 14),
        color: pick(COLORS),
        phase: rand(0, 6.28),
        twistSpeed: rand(.14, .2),
        waveAmp: rand(10, 22),
        waveFreq: rand(.3, .5),
        life: rand(150, 210),
        age: 0,
      });
    }

    function frame() {
      if (!alive) return;
      ctx.clearRect(0, 0, W, H);

      for (let i = ribbons.length - 1; i >= 0; i--) {
        const r = ribbons[i];
        r.age++;
        r.vx += rand(-.2, .2);
        r.vy += rand(-.12, .14);
        r.x += r.vx; r.y += r.vy;
        r.vy += 0.04;
        r.vx *= 0.982; r.vy *= 0.982;
        r.phase += r.twistSpeed;
        const k = 1 - r.age / r.life;
        if (k <= 0 || r.y > H + 160) { ribbons.splice(i, 1); continue; }

        const dir = Math.atan2(r.vy, r.vx);
        const cosD = Math.cos(dir), sinD = Math.sin(dir);
        const segs = 24;
        const segLen = r.len / segs;

        const left = [], right = [];
        for (let j = 0; j <= segs; j++) {
          const t = j / segs;
          const back = j * segLen;
          const wave = Math.sin(r.phase * 1.6 + j * r.waveFreq) * r.waveAmp * t;
          const mx = r.x - cosD * back - sinD * wave;
          const my = r.y - sinD * back + cosD * wave;
          const twist = Math.abs(Math.sin(r.phase + j * .5));
          const w = (r.width * (0.12 + 0.88 * twist)) / 2;
          left.push([mx - sinD * w, my + cosD * w]);
          right.push([mx + sinD * w, my - cosD * w]);
        }

        ctx.globalAlpha = Math.min(1, k * 1.8);
        ctx.fillStyle = r.color;
        ctx.beginPath();
        ctx.moveTo(left[0][0], left[0][1]);
        for (let j = 1; j <= segs; j++) ctx.lineTo(left[j][0], left[j][1]);
        for (let j = segs; j >= 0; j--) ctx.lineTo(right[j][0], right[j][1]);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      if (ribbons.length) raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => { alive = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); };
  }

  // ===== искры вокруг логотипа =====
  function startSparkles(canvas) {
    const { ctx, W, H } = makeCtx(canvas);
    const sparks = [];
    const t0 = performance.now();
    let raf = 0, alive = true;

    function spawn() {
      const a = Math.random() * Math.PI * 2;
      const radius = rand(.12, .42) * Math.min(W, H);
      sparks.push({
        x: W / 2 + Math.cos(a) * radius * rand(.8, 1.4),
        y: H / 2 + Math.sin(a) * radius * rand(.55, 1),
        size: rand(5, 15),
        color: pick(SPARKLE_COLORS),
        rot: rand(0, Math.PI),
        rotSpeed: rand(-.03, .03),
        life: rand(50, 95),
        age: 0,
      });
    }
    function drawStar(x, y, r, rot, color, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(r * .18, -r * .18, r, 0);
      ctx.quadraticCurveTo(r * .18, r * .18, 0, r);
      ctx.quadraticCurveTo(-r * .18, r * .18, -r, 0);
      ctx.quadraticCurveTo(-r * .18, -r * .18, 0, -r);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    function frame(now) {
      if (!alive) return;
      const t = now - t0;
      ctx.clearRect(0, 0, W, H);
      if (t < 4200 && sparks.length < 70) {
        for (let i = 0; i < 3; i++) spawn();
      }
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.age++;
        s.rot += s.rotSpeed;
        const k = 1 - s.age / s.life;
        if (k <= 0) { sparks.splice(i, 1); continue; }
        const pulse = .6 + .4 * Math.sin(s.age * .25);
        drawStar(s.x, s.y, s.size * pulse * (0.4 + k * 0.6), s.rot, s.color, Math.min(1, k * 2));
      }
      if (sparks.length || t < 4200) raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => { alive = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); };
  }

  const CANVAS_FNS = {
    w1: startFireworks,
    w2: startBalloons,
    w3: startRibbons,
    w5: startSparkles,
  };

  const tabs = document.querySelectorAll('.tabs button[data-v]');
  let current = 'w1';
  let stopCanvas = null;

  function play(name) {
    current = name;
    if (stopCanvas) { stopCanvas(); stopCanvas = null; }
    document.querySelectorAll('.variant').forEach(el => el.classList.remove('active', 'play'));
    tabs.forEach(b => b.classList.toggle('active', b.dataset.v === name));
    const el = document.getElementById(name);
    el.classList.add('active');
    void el.offsetWidth;
    el.classList.add('play');
    const fn = CANVAS_FNS[name];
    if (fn) stopCanvas = fn(document.getElementById('cv-' + name));
  }

  tabs.forEach(b => b.addEventListener('click', () => play(b.dataset.v)));
  document.getElementById('replay').addEventListener('click', () => play(current));
  document.addEventListener('keydown', e => {
    const map = { '1': 'w1', '2': 'w2', '3': 'w3', '4': 'w4', '5': 'w5' };
    if (map[e.key]) play(map[e.key]);
  });

  play('w1');
</script>
</body>
</html>
